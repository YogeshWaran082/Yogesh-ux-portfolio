<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Breakpoint Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #060907;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 20px;
      color: #52f97a;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
    }
    .frame-wrapper {
      background: #0d120f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .frame-title {
      font-size: 13px;
      font-weight: 600;
      color: #52f97a;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    iframe {
      border: 1px solid rgba(82, 249, 122, 0.2);
      border-radius: 12px;
      display: block;
      background: #050807;
    }
  </style>
</head>
<body>
  <h1>Hero Responsiveness Verification</h1>
  <div class="container">
    <div class="frame-wrapper">
      <div class="frame-title"><span>Mobile (390px &times; 844px) - Hero Top</span></div>
      <iframe id="iframe-390-top" src="http://localhost:8443/#home" width="390" height="844"></iframe>
    </div>
    <div class="frame-wrapper">
      <div class="frame-title"><span>Mobile (390px &times; 844px) - Scrolled to Lower Hero</span></div>
      <iframe id="iframe-390-bot" src="http://localhost:8443/#home" width="390" height="844"></iframe>
    </div>
    <div class="frame-wrapper">
      <div class="frame-title"><span>Tablet Portrait (768px &times; 1024px)</span></div>
      <iframe id="iframe-768" src="http://localhost:8443/#home" width="768" height="1024"></iframe>
    </div>
  </div>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const botFrame = document.getElementById('iframe-390-bot');
        if (botFrame && botFrame.contentWindow) {
          botFrame.contentWindow.scrollTo({ top: 400, behavior: 'instant' });
        }
      }, 1500);
    });
  </script>
</body>
</html>
